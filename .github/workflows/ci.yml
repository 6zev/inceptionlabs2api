name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # No go.sum: the module has zero dependencies. Caching on it would
          # fail the step; the build cache is keyed on go.mod instead.
          go-version-file: app/go.mod
          cache: false
      - name: build
        working-directory: app
        run: go build ./...
      - name: vet
        working-directory: app
        run: go vet ./...
      - name: test
        working-directory: app
        run: go test ./... -count=1 -race
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inceptionlabs2api:ci .
