name: release

# Cut a release by pushing a semver tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Produces:
#   - a GitHub Release with static binaries for linux/darwin/windows (amd64+arm64)
#   - a multi-arch container image on GHCR tagged 1.2.3, 1.2, 1, latest

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Allows a dry run from the Actions tab: builds and tests everything but
  # publishes nothing.
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Fail fast: never publish artifacts from a tree that does not build or test.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "app/go.mod"
          cache: false
      - name: build
        working-directory: app
        run: go build ./...
      - name: vet
        working-directory: app
        run: go vet ./...
      - name: test
        working-directory: app
        run: go test ./... -count=1 -race

  binaries:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "app/go.mod"
          cache: false

      - name: Resolve build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: app
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          OUT="inceptionlabs2api_${{ steps.meta.outputs.version }}_${GOOS}_${GOARCH}${EXT}"
          go build -trimpath \
            -ldflags="-s -w \
              -X main.version=${{ steps.meta.outputs.version }} \
              -X main.commit=${{ steps.meta.outputs.commit }} \
              -X main.date=${{ steps.meta.outputs.date }}" \
            -o "dist/${OUT}" .
          echo "artifact=${OUT}" >> "$GITHUB_ENV"

      - name: Checksum
        working-directory: app/dist
        run: sha256sum "${artifact}" > "${artifact}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: app/dist/*
          if-no-files-found: error

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only needed when publishing; the dry run still builds.
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.docker.outputs.tags }}
          labels: ${{ steps.docker.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changelog can be generated

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true

      - name: Generate changelog
        run: |
          {
            echo "Container image: \`${IMAGE}:${GITHUB_REF_NAME#v}\`"
            echo
            echo "## Changes"
            echo
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${PREV}..${GITHUB_REF_NAME}"
            else
              echo "Initial release."
            fi
            echo
          } > dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: false
          fail_on_unmatched_files: true
